# Builds distribuables : Windows, macOS, Linux (scripts/build-pc.sh) et PS Vita (make release).
# Lancement à la main (onglet Actions > Builds > Run workflow) ou en poussant un tag de version (v0.9.0) :
# un tag publie aussi les 4 fichiers dans une GitHub Release en brouillon, à relire avant de la publier.
# Pas de build à chaque push : les minutes macOS comptent 10 fois tant que le dépôt est privé.
name: Builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  SDL_VERSION: "2.30.9"   # même valeur que scripts/build-pc.sh (clé du cache)

jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc 2.35 : tourne sur les distributions de 2022 et après
    steps:
      - uses: actions/checkout@v4
      # Audio officiel : dépôt privé lu avec une clé en lecture seule. Jamais via un artefact : sur un dépôt public,
      # les artefacts d'une exécution sont téléchargeables par n'importe quel compte GitHub.
      - uses: actions/checkout@v4
        with:
          repository: m-a-fr/dne-official-audio
          ssh-key: ${{ secrets.OFFICIAL_AUDIO_KEY }}
          path: official-audio
      - run: ./scripts/official-audio.sh place official-audio
      - name: Dépendances de SDL2 (X11, Wayland, son)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev
      - uses: actions/cache@v4
        with:
          path: build-pc/sdl-${{ env.SDL_VERSION }}-linux
          key: sdl-${{ env.SDL_VERSION }}-linux-ubuntu22
      - run: ./scripts/build-pc.sh
        env:
          REQUIRE_AUDIO: "1"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/*-linux.tar.gz", if-no-files-found: error }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Audio officiel : dépôt privé lu avec une clé en lecture seule. Jamais via un artefact : sur un dépôt public,
      # les artefacts d'une exécution sont téléchargeables par n'importe quel compte GitHub.
      - uses: actions/checkout@v4
        with:
          repository: m-a-fr/dne-official-audio
          ssh-key: ${{ secrets.OFFICIAL_AUDIO_KEY }}
          path: official-audio
      - run: ./scripts/official-audio.sh place official-audio
      - uses: actions/cache@v4
        with:
          path: build-pc/sdl-${{ env.SDL_VERSION }}-macos
          key: sdl-${{ env.SDL_VERSION }}-macos-universal
      - run: ./scripts/build-pc.sh
        env:
          REQUIRE_AUDIO: "1"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*-macos.zip", if-no-files-found: error }

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # Audio officiel : dépôt privé lu avec une clé en lecture seule. Jamais via un artefact : sur un dépôt public,
      # les artefacts d'une exécution sont téléchargeables par n'importe quel compte GitHub.
      - uses: actions/checkout@v4
        with:
          repository: m-a-fr/dne-official-audio
          ssh-key: ${{ secrets.OFFICIAL_AUDIO_KEY }}
          path: official-audio
      - run: ./scripts/official-audio.sh place official-audio
        shell: bash   # MSYS2 n'est pas encore installé à ce stade du job
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make git curl tar
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
      - uses: actions/cache@v4
        with:
          path: build-pc/sdl-${{ env.SDL_VERSION }}-windows
          key: sdl-${{ env.SDL_VERSION }}-windows-mingw64
      - run: ./scripts/build-pc.sh
        env:
          REQUIRE_AUDIO: "1"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*-windows.zip", if-no-files-found: error }

  vita:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Audio officiel : dépôt privé lu avec une clé en lecture seule. Jamais via un artefact : sur un dépôt public,
      # les artefacts d'une exécution sont téléchargeables par n'importe quel compte GitHub.
      - uses: actions/checkout@v4
        with:
          repository: m-a-fr/dne-official-audio
          ssh-key: ${{ secrets.OFFICIAL_AUDIO_KEY }}
          path: official-audio
      - run: ./scripts/official-audio.sh place official-audio
      # Sans VITASDK, scripts/build-vita.sh compile dans l'image Docker officielle vitasdk/vitasdk. VITA_SDL2 : la SDL2
      # de l'image (vitaGL) est remplacée par celle de la VitaSDK de développement, rendu GXM (plus fluide)
      - run: make release
        env:
          VITA_SDL2: "2.32.8"
          REQUIRE_AUDIO: "1"
      - name: Rendu GXM (pas de vitaGL dans le binaire)
        run: "! grep -q vglInit build-release/vitagame"
      - uses: actions/upload-artifact@v4
        with: { name: vita, path: "dist/*.vpk", if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, vita]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
