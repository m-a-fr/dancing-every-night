name: Publish or remove a song
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Proposal number (publish)
        default: ''
      remove:
        description: Published ID to remove (leave empty to publish)
        default: ''
      fixture_test:
        description: Test only - publish the committed CC0 fixture instead of a private attachment
        type: boolean
        default: false
      fixture_unlicensed:
        description: Test only - with fixture_test, use the fixture that has no LICENSE
        type: boolean
        default: false
      reason:
        description: Required removal reason
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  # Seules les publications et retraits se mettent en file ; les autres événements de l'issue (étiquettes sans effet) ont leur propre
  # groupe, sinon ils annulaient la publication en cours (« cancelled » en fin d'exécution)
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved') && 'library-publication' || format('library-noop-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'song-submission'))
    runs-on: ubuntu-22.04
    environment: library-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Authorize and snapshot proposal
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          NUMBER: ${{ inputs.issue || github.event.issue.number }}
          REMOVE_ID: ${{ inputs.remove }}
          APPROVED_AT: ${{ github.event.issue.updated_at }}
          FIXTURE_TEST: ${{ inputs.fixture_test }}
          FIXTURE_UNLICENSED: ${{ inputs.fixture_unlicensed }}
        run: |
          python3 - <<'PYCODE'
          import json
          from urllib.parse import urlparse
          url = urlparse(json.load(open('library/config.json'))['download_base'])
          if url.scheme != 'https' or not url.hostname:
              raise SystemExit('Configure download_base before publishing')
          PYCODE
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo 'Maintainer permission required'; exit 1;; esac
          if [ -n "$REMOVE_ID" ]; then exit 0; fi
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh issue view "$NUMBER" --json body,title,author,labels > proposal.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" > proposal-comments.json
          if [ "$FIXTURE_TEST" = true ]; then
            if [ "$FIXTURE_UNLICENSED" = true ]; then cp library/tests/test_clicks_unlicensed.zip submission.zip
            else cp library/tests/test_clicks.zip submission.zip; fi
            python3 - <<'FIXTURE'
          import json, os
          proposal = json.load(open('proposal.json'))
          if proposal['author']['login'] != os.environ['ACTOR'] or 'publication lifecycle test' not in proposal.get('body', '') + proposal.get('title', ''):
              raise SystemExit('Fixture tests require a maintainer-owned test proposal')
          FIXTURE
            echo 'TEST ONLY: publishing the committed CC0 fixture; private attachment access is not exercised.' > source.txt
          else
            python3 tools/library_proposal.py > source.txt
          fi
          cat source.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libsdl2-dev
          pip install pillow awscli
          cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=Release -DGAME_COPY_ASSETS=OFF
          cmake --build build-desktop -j --target vitagame
      - name: Prepare publication or removal
        env:
          NUMBER: ${{ inputs.issue || github.event.issue.number }}
          REMOVE_ID: ${{ inputs.remove }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -n "$REMOVE_ID" ]; then
            python3 tools/library_publish.py --remove "$REMOVE_ID" --reason "$REASON"
          else
            submitter=$(python3 tools/library_submitter.py proposal.json)
            python3 tools/library_publish.py --zip submission.zip --submitter "$submitter" --issue "$NUMBER"
          fi
          python3 tools/catalog.py check
          bash scripts/build-editor-site.sh
      - name: Transfer prepared files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: python3 tools/library_transfer.py
      - name: Save catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library/catalog.json library/removals.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update the community song library'
          git push origin HEAD:main
      - name: Maintainer notes
        # Note privée du mainteneur (jamais dans ce dépôt : les labels, commentaires et journaux d'ici sont publics).
        # Ne bloque pas la publication : si l'écriture échoue, la chanson est publiée quand même.
        if: inputs.remove == ''
        continue-on-error: true
        env:
          NOTES_KEY: ${{ secrets.MODERATION_LEDGER_KEY }}
          NOTES_REPO: ${{ vars.MODERATION_REPO }}
        run: |
          [ -f library/dist/ledger.json ] && [ -n "$NOTES_REPO" ] && [ -n "$NOTES_KEY" ] || exit 0
          install -m 600 /dev/null "$RUNNER_TEMP/notes_key"
          printf '%s\n' "$NOTES_KEY" > "$RUNNER_TEMP/notes_key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/notes_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --quiet --depth 1 "git@github.com:$NOTES_REPO.git" "$RUNNER_TEMP/notes"
          python3 tools/library_ledger.py library/dist/ledger.json "$RUNNER_TEMP/notes/unlicensed.md"
          cd "$RUNNER_TEMP/notes"
          git add unlicensed.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m 'Note'
          for attempt in 1 2 3; do git push --quiet origin HEAD:main && break || git pull --quiet --rebase origin main; done
          rm -f "$RUNNER_TEMP/notes_key"
      - name: Announce on Discord
        # Message dans le salon dédié aux nouvelles chansons (webhook = secret de l'environnement). Ne bloque jamais la publication.
        if: inputs.remove == ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMBER: ${{ inputs.issue || github.event.issue.number }}
        run: python3 tools/library_discord.py
      - name: Notify proposal
        if: inputs.remove == ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.issue || github.event.issue.number }}
        run: |
          python3 - <<'PY' > published.md
          import json, os
          config = json.load(open('library/config.json'))
          entry = next(s for s in json.load(open('library/catalog.json'))['songs'] if s.get('issue') == int(os.environ['NUMBER']))
          print('Published: ' + config['site_url'].rstrip('/') + '/songs/' + entry['id'] + '/')
          print('\nThe site will update after its next successful deployment.')
          sent_from_editor = '<!-- editor-submission v1 -->' in json.load(open('proposal.json')).get('body', '')
          print('\nPublication ID: `' + entry['id'] + '`. ' + ('To publish a new version, send it again from the editor: a maintainer will replace this one.' if sent_from_editor else 'Submit future versions in this same proposal.'))
          print('\nLocal records remain attached to the original local ID; automatic record migration is not available yet.')
          PY
          gh issue comment "$NUMBER" --body-file published.md
          gh issue edit "$NUMBER" --add-label published --remove-label approved
